<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activities - My Portfolio</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #fffafa;
            color: #222;
        }

        /* HEADER */
        header {
            background-color: #fce4ec;
            padding: 30px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            border: 2px solid #f3a9c2;
            border-radius: 10px;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            background-color: white;
        }

        nav a:hover {
            background-color: #ffe0eb;
        }

        nav a i {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #f3a9c2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN */
        main {
            text-align: center;
            padding: 60px 20px;
        }

        main h2 {
            font-size: 35px;
            margin-bottom: 35px;
        }

        /* UPLOAD BOX */
        .upload-box {
            max-width: 850px;
            margin: auto;
            border: 2px solid #f3a9c2;
            border-radius: 15px;
            padding: 45px 30px;
            background-color: white;
        }

        .upload-box h3 {
            font-size: 25px;
            margin-top: 0;
        }

        .upload-box p {
            font-size: 18px;
        }

        /* FILE INPUT */
        #activityFile {
            border: 2px solid #f3a9c2;
            border-radius: 10px;
            padding: 12px;
            font-family: Georgia, serif;
            font-size: 16px;
            background-color: #fff;
        }

        /* UPLOAD BUTTON */
        .upload-btn {
            border: none;
            border-radius: 10px;
            padding: 14px 25px;
            margin-left: 10px;
            background-color: #d96b91;
            color: white;
            font-family: Georgia, serif;
            font-size: 17px;
            cursor: pointer;
        }

        .upload-btn:hover {
            background-color: #c6537c;
        }

        /* UPLOADED ACTIVITIES */
        .uploaded-title {
            margin-top: 40px;
            font-size: 25px;
        }

        #activitiesContainer {
            max-width: 850px;
            margin: 25px auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* ACTIVITY CARD */
        .activity-card {
            border: 2px solid #f3a9c2;
            border-radius: 15px;
            padding: 20px;
            background-color: white;
            text-align: center;
        }

        .activity-card img {
            max-width: 100%;
            max-height: 600px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .file-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* DELETE BUTTON */
        .delete-btn {
            background-color: #d96b91;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-family: Georgia, serif;
            font-size: 16px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #b83f68;
        }

        /* DOWNLOAD LINK */
        .file-link {
            display: inline-block;
            text-decoration: none;
            color: white;
            background-color: #d96b91;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .file-link:hover {
            background-color: #b83f68;
        }

        @media (max-width: 800px) {
            header {
                flex-direction: column;
                gap: 25px;
                text-align: center;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            #activityFile {
                max-width: 90%;
                margin-bottom: 10px;
            }

            .upload-btn {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>My Portfolio</h1>

    <nav>

        <a href="index.html">
            <i class="fa-solid fa-house"></i>
            Home
        </a>

        <a href="quizzes.html">
            <i class="fa-solid fa-pen-to-square"></i>
            Quizzes
        </a>

        <a href="activities.html">
            <i class="fa-solid fa-list-check"></i>
            Activities
        </a>

        <a href="exam.html">
            <i class="fa-solid fa-book"></i>
            Exam
        </a>

    </nav>

</header>


<main>

    <h2>My Activities</h2>

    <div class="upload-box">

        <h3>Insert Your Activity</h3>

        <p>Choose a photo or file of your activity:</p>

        <input
            type="file"
            id="activityFile"
            accept="image/*,.pdf,.doc,.docx,.ppt,.pptx"
        >

        <button class="upload-btn" onclick="uploadActivity()">
            Upload Activity
        </button>

        <h3 class="uploaded-title">
            Your Uploaded Activities
        </h3>

    </div>

    <div id="activitiesContainer"></div>

</main>


<script>

    // Get saved activities
    let activities = JSON.parse(localStorage.getItem("activities")) || [];


    // DISPLAY ACTIVITIES
    function displayActivities() {

        const container = document.getElementById("activitiesContainer");

        container.innerHTML = "";

        activities.forEach((activity, index) => {

            const card = document.createElement("div");

            card.className = "activity-card";


            // File name
            const name = document.createElement("div");

            name.className = "file-name";

            name.textContent = activity.name;

            card.appendChild(name);


            // If image
            if (activity.type.startsWith("image/")) {

                const image = document.createElement("img");

                image.src = activity.data;

                card.appendChild(image);

            }

            // If not image
            else {

                const link = document.createElement("a");

                link.href = activity.data;

                link.download = activity.name;

                link.textContent = "Open / Download File";

                link.className = "file-link";

                card.appendChild(link);
            }


            // Delete button
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";

            deleteButton.className = "delete-btn";

            deleteButton.onclick = function() {

                deleteActivity(index);

            };

            card.appendChild(deleteButton);


            container.appendChild(card);

        });

    }


    // UPLOAD ACTIVITY
    function uploadActivity() {

        const fileInput = document.getElementById("activityFile");

        const file = fileInput.files[0];


        if (!file) {

            alert("Please choose an activity first.");

            return;
        }


        const reader = new FileReader();


        reader.onload = function(event) {

            const activity = {

                name: file.name,

                type: file.type,

                data: event.target.result

            };


            activities.push(activity);


            // Save to browser
            localStorage.setItem(
                "activities",
                JSON.stringify(activities)
            );


            // Refresh display
            displayActivities();


            // Clear file input
            fileInput.value = "";

        };


        reader.readAsDataURL(file);

    }


    // DELETE ACTIVITY
    function deleteActivity(index) {

        if (confirm("Are you sure you want to delete this activity?")) {

            activities.splice(index, 1);

            localStorage.setItem(
                "activities",
                JSON.stringify(activities)
            );

            displayActivities();

        }

    }


    // SHOW SAVED ACTIVITIES WHEN PAGE OPENS
    displayActivities();

</script>

</body>
</html>
