<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Portfolio</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Cute Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Dancing+Script:wght@400;500;600&display=swap"
        rel="stylesheet">


    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background-color: #ffd1e1;
            color: #222;
            min-height: 100vh;
            cursor: none;
        }


        /* =========================
           CUSTOM CURSOR
        ========================= */

        .custom-cursor {
            position: fixed;

            width: 20px;
            height: 20px;

            background-color: #f3a9c2;

            border: 3px solid white;

            border-radius: 50%;

            pointer-events: none;

            transform: translate(-50%, -50%);

            z-index: 10000;

            box-shadow:
                0 0 8px #f3a9c2,
                0 0 18px rgba(243, 169, 194, 0.8);

            transition:
                width 0.15s ease,
                height 0.15s ease;
        }


        .custom-cursor.hover {
            width: 30px;
            height: 30px;

            background-color: rgba(243, 169, 194, 0.6);

            box-shadow:
                0 0 10px #f3a9c2,
                0 0 25px #f3a9c2;
        }


        /* =========================
           CURSOR TRAIL
        ========================= */

        #cursorTrail {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 9998;
        }


        /* =========================
           FLOATING HEART BACKGROUND
        ========================= */

        .floating-hearts {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .floating-hearts span {
            position: absolute;

            bottom: -50px;

            color: #c94f7c;

            font-size: 35px;

            opacity: 0.6;

            animation: floatUp 10s linear infinite;
        }


        .floating-hearts span:nth-child(1) {
            left: 8%;
            animation-delay: 0s;
            font-size: 30px;
        }

        .floating-hearts span:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
            font-size: 22px;
        }

        .floating-hearts span:nth-child(3) {
            left: 35%;
            animation-delay: 4s;
            font-size: 40px;
        }

        .floating-hearts span:nth-child(4) {
            left: 50%;
            animation-delay: 1s;
            font-size: 28px;
        }

        .floating-hearts span:nth-child(5) {
            left: 65%;
            animation-delay: 5s;
            font-size: 35px;
        }

        .floating-hearts span:nth-child(6) {
            left: 75%;
            animation-delay: 3s;
            font-size: 25px;
        }

        .floating-hearts span:nth-child(7) {
            left: 88%;
            animation-delay: 6s;
            font-size: 40px;
        }

        .floating-hearts span:nth-child(8) {
            left: 45%;
            animation-delay: 7s;
            font-size: 20px;
        }


        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.6;
            }

            50% {
                transform: translateY(-400px) rotate(20deg);
            }

            100% {
                transform: translateY(-100vh) rotate(-20deg);
                opacity: 0;
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: relative;

            z-index: 10;

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 25px 35px;

            background-color: #ffe0ec;
        }


        .logo {
            text-decoration: none;

            color: #222;

            font-family: "Comic Neue", sans-serif;

            font-size: 50px;

            font-weight: bold;

            margin: 0;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;

            gap: 12px;

            align-items: center;

            justify-content: flex-end;

            margin-left: auto;
        }


        nav a {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding: 10px 18px;

            text-decoration: none;

            color: #222;

            font-family: "Comic Neue", sans-serif;

            font-size: 27px;

            font-weight: 700;

            background-color: #ffe8f0;

            border: 3px solid #f8b8ce;

            border-radius: 11px;

            transition: 0.3s ease;
        }


        nav a i {
            width: 45px;
            height: 45px;

            border-radius: 50%;

            background-color: #f3a9c2;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            color: transparent;
        }


        nav a i::before {
            color: transparent;
        }


        nav a:hover {
            background-color: #f3a9c5;

            transform: translateY(-3px);

            box-shadow:
                0 5px 15px rgba(201, 79, 124, 0.25);
        }


        /* =========================
           HOME
        ========================= */

        .home {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 70px;

            width: 100%;

            min-height: calc(100vh - 120px);

            padding: 50px 40px;

            margin: 0 auto;
        }


        /* =========================
           HOME IMAGE
        ========================= */

        .home-img {
            width: 400px;
            height: 400px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;
        }


        .home-img img {
            width: 400px;
            height: 400px;

            object-fit: cover;

            border-radius: 20px;

            background-color: #eca3bc;

            box-shadow:
                0 10px 30px rgba(180, 70, 110, 0.18);

            position: relative;

            z-index: 2;
        }


        .home-img::before {
            content: "♡";

            position: absolute;

            font-size: 340px;

            color: #f5b2ca;

            line-height: 1;

            z-index: 1;

            transform: scale(1.15);
        }


        /* =========================
           HOME CONTENT
        ========================= */

        .home-content {
            width: 550px;

            max-width: 550px;

            text-align: left;
        }


        .home-content h1 {
            font-family: "Comic Neue", sans-serif;

            font-size: 48px;

            margin: 0 0 25px 0;

            color: #292929;
        }


        .home-content h3 {
            font-family: "Comic Neue", sans-serif;

            font-size: 30px;

            margin: 0 0 25px 0;
        }


        .home-content p {
            font-family: "Dancing Script", cursive;

            font-size: 25px;

            line-height: 1.7;

            margin: 0 0 5px 0;

            color: #000000;
        }


        /* =========================
           CHANGING NAME
        ========================= */

        .name-text span {
            position: relative;
        }


        .name-text span::after {
            content: "Charm";

            animation:
                nameChange 10s infinite,
                nameColor 10s infinite;
        }


        @keyframes nameChange {

            0%,
            30% {
                content: "Charm";
            }

            31%,
            60% {
                content: "チャーム";
            }

            61%,
            90% {
                content: "참";
            }

            91%,
            100% {
                content: "Charm";
            }

        }


        @keyframes nameColor {

            0%,
            30% {
                color: #d94f83;
            }

            31%,
            60% {
                color: #9b59b6;
            }

            61%,
            90% {
                color: #e06aa0;
            }

            91%,
            100% {
                color: #d94f83;
            }

        }


        /* =========================
           TYPING TEXT
        ========================= */

        .typing-text span {
            position: relative;
        }


        .typing-text span::after {
            content: " Computer Science Student";

            animation: words 10s infinite;

            animation-delay: 0.8s;
        }


        @keyframes words {

            0% {
                content: " Computer Science Student";
            }

            50% {
                content: " from CVSU Silang";
            }

            100% {
                content: " BSCS-3B";
            }

        }


        /* ==================================================
           POP-UP
        ================================================== */

        .quiz-popup {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(80, 30, 55, 0.35);

            backdrop-filter: blur(5px);

            display: flex;

            align-items: center;

            justify-content: center;

            opacity: 0;

            visibility: hidden;

            z-index: 20000;

            transition:
                opacity 0.35s ease,
                visibility 0.35s ease;
        }


        .quiz-popup.show {

            opacity: 1;

            visibility: visible;
        }


        /* =========================
           POP-UP BOX
        ========================= */

        .quiz-popup-box {

            width: 90%;

            height: 88%;

            background-color: #fff8fb;

            border: 4px solid #f3a9c2;

            border-radius: 25px;

            box-shadow:
                0 20px 60px rgba(150, 60, 100, 0.3);

            overflow: hidden;

            position: relative;

            transform: scale(0.65);

            opacity: 0;
        }


        .quiz-popup.show .quiz-popup-box {

            animation:
                quizPopUp
                0.6s
                cubic-bezier(.17,.67,.35,1.25)
                forwards;
        }


        @keyframes quizPopUp {

            0% {

                transform: scale(0.65);

                opacity: 0;
            }

            60% {

                transform: scale(1.04);

                opacity: 1;
            }

            80% {

                transform: scale(0.98);
            }

            100% {

                transform: scale(1);

                opacity: 1;
            }

        }


        /* =========================
           POP-UP HEADER
        ========================= */

        .quiz-popup-header {

            height: 65px;

            background-color: #ffe0ec;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px 0 25px;

            border-bottom: 3px solid #f3a9c2;
        }


        .quiz-popup-header h2 {

            margin: 0;

            font-family: "Comic Neue", sans-serif;

            font-size: 28px;

            color: #333;
        }


        /* =========================
           CLOSE BUTTON
        ========================= */

        .close-quiz {

            width: 42px;

            height: 42px;

            border: none;

            border-radius: 50%;

            background-color: #f3a9c2;

            color: white;

            font-size: 25px;

            font-weight: bold;

            cursor: none;

            transition: 0.3s ease;
        }


        .close-quiz:hover {

            background-color: #d94f83;

            transform: rotate(90deg) scale(1.1);
        }


        /* =========================
           IFRAME
        ========================= */

        .quiz-popup iframe {

            width: 100%;

            height: calc(100% - 65px);

            border: none;

            display: block;

            background-color: #fff8fb;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {

            header {

                flex-direction: column;

                gap: 20px;
            }

            nav {

                margin-left: 0;

                flex-wrap: wrap;

                justify-content: center;
            }

            .home {

                gap: 40px;
            }

            .home-img,
            .home-img img {

                width: 350px;

                height: 350px;
            }

            .home-content {

                width: 480px;
            }

            .home-content h1 {

                font-size: 42px;
            }

        }


        @media (max-width: 900px) {

            header {

                padding: 25px;
            }

            .logo {

                font-size: 42px;
            }

            nav a {

                font-size: 20px;

                padding: 8px 12px;
            }

            nav a i {

                width: 35px;

                height: 35px;
            }

            .home {

                flex-direction: column;

                min-height: auto;

                padding: 70px 20px;

                text-align: center;

                gap: 40px;
            }

            .home-img,
            .home-img img {

                width: 330px;

                height: 330px;
            }

            .home-content {

                width: 100%;

                max-width: 650px;

                text-align: center;
            }

            .home-content h1 {

                font-size: 40px;
            }

            .home-content h3 {

                font-size: 26px;
            }

            .home-content p {

                font-size: 22px;
            }

            .quiz-popup-box {

                width: 95%;

                height: 90%;
            }

        }


        @media (max-width: 500px) {

            .logo {

                font-size: 35px;
            }

            nav a span {

                display: none;
            }

            nav a {

                padding: 8px;
            }

            .home-img,
            .home-img img {

                width: 280px;

                height: 280px;
            }

            .home-content h1 {

                font-size: 32px;
            }

            .home-content h3 {

                font-size: 22px;
            }

            .home-content p {

                font-size: 20px;
            }

            .quiz-popup-box {

                width: 96%;

                height: 92%;

                border-radius: 18px;
            }

            .quiz-popup-header h2 {

                font-size: 22px;
            }

        }

    </style>

</head>


<body>

    <header>

        <nav>

            <!-- HOME -->

            <a href="#" id="homeLink" class="active">

                class="img-fluid"

        </div>


        <div class="home-content">

            <h1 class="name-text">

                Halooo! It's me <span></span>

            </h1>


            <h3 class="typing-text">

            </p>

    </section>


    <!-- ==================================================

    ================================================== -->

    <div class="quiz-popup" id="quizPopup">

        <div class="quiz-popup-box">

            <div class="quiz-popup-header">

                <h2 id="popupTitle">
                    💗 My Quizzes
                </h2>


                <button
                    class="close-quiz"

                    ×

                </button>

            </div>

                src="about:blank"
                id="quizFrame"
                title="Portfolio Content">

    <!-- =========================
         CURSOR TRAIL
    ========================= -->

    <canvas id="cursorTrail"></canvas>


    <!-- =========================
         CUSTOM CURSOR
    ========================= -->

    <div class="custom-cursor"></div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* ==================================================
           CUSTOM CURSOR
        ================================================== */

        const cursor =
            document.querySelector(".custom-cursor");

        const canvas =
            document.getElementById("cursorTrail");

        const ctx =
            canvas.getContext("2d");


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }

        resizeCanvas();


        let mouseX =
            window.innerWidth / 2;

        let mouseY =
            window.innerHeight / 2;


        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;

                cursor.style.left =
                    mouseX + "px";

                cursor.style.top =
                    mouseY + "px";

                createHeart(
                    mouseX,
                    mouseY
                );

            }
        );


        /* ==================================================
           HEART PARTICLES
        ================================================== */

        let hearts = [];


        function createHeart(x, y) {

            hearts.push({

                x: x,

                y: y,

                size:
                    Math.random() * 10 + 8,

                speedY:
                    Math.random() * -1.5 - 0.5,

                speedX:
                    (Math.random() - 0.5) * 1.5,

                opacity: 1,

                rotation:
                    Math.random() * 360

            });


            if (hearts.length > 45) {

                hearts.shift();

            }

        }


        function drawHeart(
            x,
            y,
            size,
            rotation,
            opacity
        ) {

            ctx.save();

            ctx.translate(x, y);

            ctx.rotate(
                rotation * Math.PI / 180
            );

            ctx.globalAlpha =
                opacity;

            ctx.fillStyle =
                "#f3a9c2";

            ctx.shadowBlur =
                12;

            ctx.shadowColor =
                "#f3a9c2";

            ctx.beginPath();

            ctx.moveTo(
                0,
                size * 0.3
            );

            ctx.bezierCurveTo(
                -size,
                -size * 0.3,
                -size * 0.6,
                -size,
                0,
                -size * 0.35
            );

            ctx.bezierCurveTo(
                size * 0.6,
                -size,
                size,
                -size * 0.3,
                0,
                size * 0.3
            );

            ctx.fill();

            ctx.restore();

        }


        function animate() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            for (
                let i = hearts.length - 1;
                i >= 0;
                i--
            ) {

                const heart =
                    hearts[i];

                heart.x +=
                    heart.speedX;

                heart.y +=
                    heart.speedY;

                heart.opacity -=
                    0.015;

                heart.size *=
                    0.995;


                drawHeart(
                    heart.x,
                    heart.y,
                    heart.size,
                    heart.rotation,
                    heart.opacity
                );


                if (
                    heart.opacity <= 0
                ) {

                    hearts.splice(i, 1);

                }

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();


        window.addEventListener(
            "resize",
            function() {

                resizeCanvas();

            }
        );


        /* ==================================================
           CURSOR HOVER EFFECT
        ================================================== */

        const clickableElements =
            document.querySelectorAll(
                "a, button"
            );


        clickableElements.forEach(
            function(element) {

                element.addEventListener(
                    "mouseenter",
                    function() {

                        cursor.classList.add(
                            "hover"
                        );

                    }
                );


                element.addEventListener(
                    "mouseleave",
                    function() {

                        cursor.classList.remove(
                            "hover"
                        );

                    }
                );

            }
        );


        /* ==================================================
           POP-UP ELEMENTS
        ================================================== */

        const quizzesLink =
            document.getElementById(
                "quizzesLink"
            );

        const activitiesLink =
            document.getElementById(
                "activitiesLink"
            );

        const examLink =
            document.getElementById(
                "examLink"
            );

        const homeLink =
            document.getElementById(
                "homeLink"
            );

        const quizPopup =
            document.getElementById(
                "quizPopup"
            );

        const quizFrame =
            document.getElementById(
                "quizFrame"
            );

        const closeQuiz =
            document.getElementById(
                "closeQuiz"
            );

        const popupTitle =
            document.getElementById(
                "popupTitle"
            );


        /* ==================================================
           OPEN POPUP
        ================================================== */

        function openPopup(page, title) {

            /*
             * Show popup
             */

            quizPopup.classList.add(
                "show"
            );


            /*
             * Change title
             */

            popupTitle.innerHTML =
                title;


            /*
             * Clear previous iframe
             */

            quizFrame.src =
                "about:blank";


            /*
             * Load new page
             */

            setTimeout(
                function() {

                    quizFrame.src =
                        page;

                },
                100
            );

        }


        /* ==================================================
           QUIZZES
        ================================================== */

        quizzesLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                openPopup(
                    "quizzes.html",
                    "💗 My Quizzes"
                );

            }
        );


        /* ==================================================
           ACTIVITIES
        ================================================== */

        activitiesLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                openPopup(
                    "Activities.html",
                    "💗 My Activities"
                );

            }
        );


        /* ==================================================
           EXAM
        ================================================== */

        examLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                openPopup(
                    "exam.html",
                    "💗 My Exam"
                );

            }
        );


        /* ==================================================
           HOME
        ================================================== */

        homeLink.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                closePopup();

            }
        );


        /* ==================================================
           CLOSE POPUP FUNCTION
        ================================================== */

        function closePopup() {

            /*
             * Hide popup
             */

            quizPopup.classList.remove(
                "show"
            );


            /*
             * Completely clear iframe
             */

            setTimeout(
                function() {

                    quizFrame.src =
                        "about:blank";

                    popupTitle.innerHTML =
                        "💗 My Quizzes";

                },
                350
            );

        }


        /* ==================================================
           X BUTTON
        ================================================== */

        closeQuiz.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                event.stopPropagation();

                closePopup();

            }
        );


        /* ==================================================
           CLICK OUTSIDE POPUP
        ================================================== */

        quizPopup.addEventListener(
            "click",
            function(event) {

                if (
                    event.target ===
                    quizPopup
                ) {

                    closePopup();

                }

            }
        );


        /* ==================================================
           ESC KEY
        ================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape" &&
                    quizPopup.classList.contains(
                        "show"
                    )
                ) {

                    closePopup();

                }

            }
        );


        /* ==================================================
           NAVIGATION INSIDE IFRAME
        ================================================== */

        quizFrame.addEventListener(
            "load",
            function() {

                try {

                    const iframeDocument =
                        quizFrame.contentDocument ||
                        quizFrame.contentWindow.document;


                    /*
                     * Get all links
                     * inside current page
                     */

                    const links =
                        iframeDocument.querySelectorAll(
                            "a"
                        );


                    links.forEach(
                        function(link) {

                            const href =
                                link.getAttribute(
                                    "href"
                                );


                            if (!href) {

                                return;

                            }


                            /*
                             * ACTIVITIES
                             */

                            if (
                                href
                                .toLowerCase()
                                .endsWith(
                                    "activities.html"
                                )
                            ) {

                                link.addEventListener(
                                    "click",
                                    function(event) {

                                        event.preventDefault();

                                        openPopup(
                                            "Activities.html",
                                            "💗 My Activities"
                                        );

                                    }
                                );

                            }


                            /*
                             * QUIZZES
                             */

                            if (
                                href
                                .toLowerCase()
                                .endsWith(
                                    "quizzes.html"
                                )
                            ) {

                                link.addEventListener(
                                    "click",
                                    function(event) {

                                        event.preventDefault();

                                        openPopup(
                                            "quizzes.html",
                                            "💗 My Quizzes"
                                        );

                                    }
                                );

                            }


                            /*
                             * EXAM
                             */

                            if (
                                href
                                .toLowerCase()
                                .endsWith(
                                    "exam.html"
                                )
                            ) {

                                link.addEventListener(
                                    "click",
                                    function(event) {

                                        event.preventDefault();

                                        openPopup(
                                            "exam.html",
                                            "💗 My Exam"
                                        );

                                    }
                                );

                            }


                            /*
                             * HOME
                             */

                            if (
                                href
                                .toLowerCase()
                                .endsWith(
                                    "index.html"
                                )
                            ) {

                                link.addEventListener(
                                    "click",
                                    function(event) {

                                        event.preventDefault();

                                        closePopup();

                                    }
                                );

                            }

                        }
                    );

                }

                catch (error) {

                    console.log(
                        "Iframe navigation error:",
                        error
                    );

                }

            }
        );

    </script>


</body>

</html>
