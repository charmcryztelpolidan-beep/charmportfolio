<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam - My Portfolio</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Cute Font -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
        rel="stylesheet">

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #fffafa;
            color: #222;
            min-height: 100vh;

            /* Hide default cursor */
            cursor: none;
        }


        /* =========================
           CUSTOM PINK CURSOR
        ========================= */

        .custom-cursor {
            position: fixed;

            width: 20px;
            height: 20px;

            background-color: #f3a9c2;

            border: 3px solid white;

            border-radius: 50%;

            pointer-events: none;

            transform: translate(-50%, -50%);

            z-index: 10000;

            box-shadow:
                0 0 8px #f3a9c2,
                0 0 18px rgba(243, 169, 194, 0.8);

            transition:
                width 0.15s ease,
                height 0.15s ease;
        }


        /* Cursor kapag nasa button/link */

        .custom-cursor.hover {
            width: 30px;
            height: 30px;

            background-color: rgba(243, 169, 194, 0.6);

            box-shadow:
                0 0 10px #f3a9c2,
                0 0 25px #f3a9c2;
        }


        /* =========================
           GLOWING HEART TRAIL
        ========================= */

        #cursorTrail {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 9998;
        }


        /* =========================
           FLOATING HEART BACKGROUND
        ========================= */

        .floating-hearts {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .floating-hearts span {
            position: absolute;

            bottom: -50px;

            color: #e88aaa;

            font-size: 35px;

            opacity: 0.45;

            animation: floatUp 10s linear infinite;
        }


        .floating-hearts span:nth-child(1) {
            left: 8%;
            animation-delay: 0s;
            font-size: 30px;
        }


        .floating-hearts span:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
            font-size: 22px;
        }


        .floating-hearts span:nth-child(3) {
            left: 35%;
            animation-delay: 4s;
            font-size: 40px;
        }


        .floating-hearts span:nth-child(4) {
            left: 50%;
            animation-delay: 1s;
            font-size: 28px;
        }


        .floating-hearts span:nth-child(5) {
            left: 65%;
            animation-delay: 5s;
            font-size: 35px;
        }


        .floating-hearts span:nth-child(6) {
            left: 75%;
            animation-delay: 3s;
            font-size: 25px;
        }


        .floating-hearts span:nth-child(7) {
            left: 88%;
            animation-delay: 6s;
            font-size: 40px;
        }


        .floating-hearts span:nth-child(8) {
            left: 45%;
            animation-delay: 7s;
            font-size: 20px;
        }


        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 0.45;
            }

            50% {
                transform:
                    translateY(-400px)
                    rotate(20deg);
            }

            100% {
                transform:
                    translateY(-100vh)
                    rotate(-20deg);

                opacity: 0;
            }
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: relative;

            z-index: 10;

            background-color: #fce4ec;

            padding: 30px 50px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        header h1 {
            margin: 0;

            font-family: "Comic Neue", sans-serif;

            font-size: 35px;
        }


        /* =========================
           NAVIGATION
        ========================= */

        nav {
            display: flex;

            gap: 15px;
        }


        nav a {
            text-decoration: none;

            color: #222;

            border: 2px solid #f3a9c2;

            border-radius: 10px;

            padding: 12px 25px;

            display: flex;

            align-items: center;

            gap: 12px;

            font-family: "Comic Neue", sans-serif;

            font-size: 22px;

            font-weight: 700;

            background-color: white;

            transition: 0.3s ease;
        }


        nav a:hover {
            background-color: #ffe0eb;

            transform: translateY(-3px);

            box-shadow:
                0 5px 15px rgba(201, 79, 124, 0.2);
        }


        nav a i {
            width: 45px;

            height: 45px;

            border-radius: 50%;

            background-color: #f3a9c2;

            display: flex;

            align-items: center;

            justify-content: center;

            color: transparent;

            font-size: 0;

            flex-shrink: 0;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            position: relative;

            z-index: 2;

            text-align: center;

            padding: 60px 20px;
        }


        main h2 {
            font-family: "Comic Neue", sans-serif;

            font-size: 35px;

            margin-bottom: 35px;

            color: #292929;
        }


        /* =========================
           EXAMS CONTAINER
        ========================= */

        #examsContainer {
            max-width: 850px;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            gap: 25px;
        }


        /* =========================
           EXAM CARD
        ========================= */

        .exam-card {
            border: 2px solid #f3a9c2;

            border-radius: 15px;

            padding: 20px;

            background-color: rgba(255, 255, 255, 0.95);

            text-align: center;

            box-shadow:
                0 8px 20px rgba(201, 79, 124, 0.12);

            transition: 0.3s ease;
        }


        .exam-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 12px 25px rgba(201, 79, 124, 0.18);
        }


        /* =========================
           EXAM NAME
        ========================= */

        .file-name {
            font-family: "Comic Neue", sans-serif;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;

            color: #333;
        }


        /* =========================
           FILE LINK
        ========================= */

        .file-link {
            display: inline-block;

            text-decoration: none;

            color: white;

            background-color: #d96b91;

            padding: 10px 20px;

            border-radius: 8px;

            font-family: "Comic Neue", sans-serif;

            transition: 0.3s ease;
        }


        .file-link:hover {
            background-color: #b83f68;

            transform: scale(1.05);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            header {
                flex-direction: column;

                gap: 25px;

                text-align: center;

                padding: 25px;
            }


            nav {
                flex-wrap: wrap;

                justify-content: center;
            }


            nav a {
                font-size: 16px;

                padding: 10px 15px;
            }


            nav a i {
                width: 35px;

                height: 35px;
            }


            main {
                padding: 40px 15px;
            }


            main h2 {
                font-size: 30px;
            }


            .exam-card {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         FLOATING HEARTS
    ========================= -->

    <div class="floating-hearts">

        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>

    </div>



    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1></h1>


        <nav>

            <a href="index.html">

                <i class="fa-solid fa-house"></i>

                Home

            </a>


            <a href="quizzes.html">

                <i class="fa-solid fa-pen-to-square"></i>

                Quizzes

            </a>


            <a href="activities.html">

                <i class="fa-solid fa-list-check"></i>

                Activities

            <a href="exam.html">

                <i class="fa-solid fa-book"></i>

        </nav>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>

        <h2>
            My Exams
        </h2>


        <div id="examsContainer">


            <!-- =========================
                 ADD YOUR EXAMS HERE
            ========================= -->

            <!--

            Example:

            <div class="exam-card">

                <div class="file-name">
                    Exam 1
                </div>

                <a
                    href="exams/exam1.pdf"
                    target="_blank"
                    class="file-link">

                    Open Exam

                </a>

            </div>

            -->


        </div>

    </main>



    <!-- =========================
         CURSOR TRAIL
    ========================= -->

    <canvas id="cursorTrail"></canvas>


    <!-- =========================
         CUSTOM CURSOR
    ========================= -->

    <div class="custom-cursor"></div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const cursor =
            document.querySelector(".custom-cursor");

        const canvas =
            document.getElementById("cursorTrail");

        const ctx =
            canvas.getContext("2d");


        /* =========================
           CANVAS SIZE
        ========================= */

        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }

        resizeCanvas();



        /* =========================
           MOUSE POSITION
        ========================= */

        let mouseX =
            window.innerWidth / 2;

        let mouseY =
            window.innerHeight / 2;


        document.addEventListener(
            "mousemove",
            function(event) {

                mouseX =
                    event.clientX;

                mouseY =
                    event.clientY;


                cursor.style.left =
                    mouseX + "px";

                cursor.style.top =
                    mouseY + "px";


                createHeart(
                    mouseX,
                    mouseY
                );

            }
        );



        /* =========================
           HEART PARTICLES
        ========================= */

        let hearts = [];


        function createHeart(x, y) {

            hearts.push({

                x: x,

                y: y,

                size:
                    Math.random() * 10 + 8,

                speedY:
                    Math.random() * -1.5 - 0.5,

                speedX:
                    (Math.random() - 0.5) * 1.5,

                opacity: 1,

                rotation:
                    Math.random() * 360

            });


            if (hearts.length > 45) {

                hearts.shift();

            }

        }



        /* =========================
           DRAW HEART
        ========================= */

        function drawHeart(
            x,
            y,
            size,
            rotation,
            opacity
        ) {

            ctx.save();


            ctx.translate(
                x,
                y
            );


            ctx.rotate(
                rotation *
                Math.PI /
                180
            );


            ctx.globalAlpha =
                opacity;


            ctx.fillStyle =
                "#f3a9c2";


            ctx.shadowBlur =
                12;


            ctx.shadowColor =
                "#f3a9c2";


            ctx.beginPath();


            ctx.moveTo(
                0,
                size * 0.3
            );


            ctx.bezierCurveTo(
                -size,
                -size * 0.3,

                -size * 0.6,
                -size,

                0,
                -size * 0.35
            );


            ctx.bezierCurveTo(
                size * 0.6,
                -size,

                size,
                -size * 0.3,

                0,
                size * 0.3
            );


            ctx.fill();


            ctx.restore();

        }



        /* =========================
           ANIMATION
        ========================= */

        function animate() {

            ctx.clearRect(
                0,
                0,

                canvas.width,
                canvas.height
            );


            for (
                let i = hearts.length - 1;
                i >= 0;
                i--
            ) {

                const heart =
                    hearts[i];


                heart.x +=
                    heart.speedX;


                heart.y +=
                    heart.speedY;


                heart.opacity -=
                    0.015;


                heart.size *=
                    0.995;


                drawHeart(
                    heart.x,
                    heart.y,
                    heart.size,
                    heart.rotation,
                    heart.opacity
                );


                if (
                    heart.opacity <= 0
                ) {

                    hearts.splice(
                        i,
                        1
                    );

                }

            }


            requestAnimationFrame(
                animate
            );

        }


        animate();



        /* =========================
           RESIZE
        ========================= */

        window.addEventListener(
            "resize",
            function() {

                resizeCanvas();

            }
        );



        /* =========================
           CURSOR HOVER EFFECT
        ========================= */

        const clickableElements =
            document.querySelectorAll(
                "a, button"
            );


        clickableElements.forEach(
            function(element) {

                element.addEventListener(
                    "mouseenter",
                    function() {

                        cursor.classList.add(
                            "hover"
                        );

                    }
                );


                element.addEventListener(
                    "mouseleave",
                    function() {

                        cursor.classList.remove(
                            "hover"
                        );

                    }
                );

            }
        );

    </script>


</body>

</html>
