<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quizzes - My Portfolio</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #fffafa;
            color: #222;
        }

        /* HEADER */
        header {
            background-color: #fce4ec;
            padding: 30px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            gap: 15px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            border: 2px solid #f3a9c2;
            border-radius: 10px;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            background-color: white;
        }

        nav a:hover {
            background-color: #ffe0eb;
        }

        nav a i {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: #f3a9c2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* MAIN */
        main {
            text-align: center;
            padding: 60px 20px;
        }

        main h2 {
            font-size: 35px;
            margin-bottom: 35px;
        }

        /* QUIZZES CONTAINER */
        #quizzesContainer {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* QUIZ CARD */
        .quiz-card {
            border: 2px solid #f3a9c2;
            border-radius: 15px;
            padding: 20px;
            background-color: white;
            text-align: center;
        }

        /* QUIZ NAME */
        .file-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* QUIZ IMAGE */
        .quiz-card img {
            display: block;
            width: 100%;
            max-width: 800px;
            max-height: 800px;
            object-fit: contain;
            margin: 0 auto;
            border-radius: 10px;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            header {
                flex-direction: column;
                gap: 25px;
                text-align: center;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 16px;
                padding: 10px 15px;
            }

            nav a i {
                width: 35px;
                height: 35px;
            }

            main {
                padding: 40px 15px;
            }

            main h2 {
                font-size: 30px;
            }

            .quiz-card {
                padding: 12px;
            }

            .quiz-card img {
                width: 100%;
            }
        }

    </style>
</head>

<body>

<header>

    <h1></h1>

    <nav>

        <a href="quizzes.html">
            <i class="fa-solid fa-pen-to-square"></i>
            Quizzes
        </a>

        <a href="activities.html">
            <i class="fa-solid fa-list-check"></i>
            Activities
        </a>

        <a href="exam.html">
            <i class="fa-solid fa-book"></i>
            Exam
        </a>

    </nav>

</header>


<main>

        </div>

</main>

</body>
</html>
