<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activities - My Portfolio</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

    <!-- Cute Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: #fffafa;
            color: #222;
            cursor: none;
            min-height: 100vh;
        }

        /* CUSTOM CURSOR */

        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            background-color: #f3a9c2;
            border: 3px solid white;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 30000;
            opacity: 0;

            box-shadow:
                0 0 8px #f3a9c2,
                0 0 18px rgba(243, 169, 194, 0.8);

            transition:
                width 0.15s ease,
                height 0.15s ease,
                opacity 0.15s ease;
        }

        .custom-cursor.hover {
            width: 30px;
            height: 30px;
            background-color: rgba(243, 169, 194, 0.6);

            box-shadow:
                0 0 10px #f3a9c2,
                0 0 25px #f3a9c2;
        }

        /* CURSOR TRAIL */

        #cursorTrail {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        /* FLOATING HEARTS */

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .floating-hearts span {
            position: absolute;
            bottom: -50px;
            color: #e88aaa;
            font-size: 35px;
            opacity: 0.45;
            animation: floatUp 10s linear infinite;
        }

        .floating-hearts span:nth-child(1) {
            left: 8%;
            animation-delay: 0s;
            font-size: 30px;
        }

        .floating-hearts span:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
            font-size: 22px;
        }

        .floating-hearts span:nth-child(3) {
            left: 35%;
            animation-delay: 4s;
            font-size: 40px;
        }

        .floating-hearts span:nth-child(4) {
            left: 50%;
            animation-delay: 1s;
            font-size: 28px;
        }

        .floating-hearts span:nth-child(5) {
            left: 65%;
            animation-delay: 5s;
            font-size: 35px;
        }

        .floating-hearts span:nth-child(6) {
            left: 75%;
            animation-delay: 3s;
            font-size: 25px;
        }

        .floating-hearts span:nth-child(7) {
            left: 88%;
            animation-delay: 6s;
            font-size: 40px;
        }

        .floating-hearts span:nth-child(8) {
            left: 45%;
            animation-delay: 7s;
            font-size: 20px;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.45;
            }

            50% {
                transform: translateY(-400px) rotate(20deg);
            }

            100% {
                transform: translateY(-100vh) rotate(-20deg);
                opacity: 0;
            }
        }

        /* HEADER */

        header {
            position: relative;
            z-index: 10;
            background-color: #fce4ec;
            height: 40px;
        }

        /* MAIN */

        main {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 60px 20px;
        }

        main h2 {
            font-family: "Comic Neue", sans-serif;
            font-size: 35px;
            margin-bottom: 35px;
            color: #292929;
        }

        /* ACTIVITIES CONTAINER */

        #activitiesContainer {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 300px));
            gap: 25px;
            justify-content: center;
            align-items: start;
        }

        /* ACTIVITY CARD */

        .activity-card {
            position: relative;
            border: 2px solid #f3a9c2;
            border-radius: 15px;
            overflow: hidden;
            background-color: white;
            text-align: left;
            cursor: none;

            box-shadow:
                0 8px 20px rgba(201, 79, 124, 0.15);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .activity-card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 12px 25px rgba(201, 79, 124, 0.25);
        }

        /* PDF IMAGE PREVIEW */

        .pdf-preview {
            width: 100%;
            height: 200px;
            background-color: #fce4ec;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .pdf-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;

            transition: transform 0.3s ease;
        }

        .activity-card:hover .pdf-preview img {
            transform: scale(1.03);
        }

        /* ACTIVITY INFORMATION */

        .activity-info {
            padding: 12px 14px 14px;
            background-color: #f8d8e5;
        }

        .file-name {
            font-family: "Comic Neue", sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #333;
        }

        .activity-date {
            font-family: "Comic Neue", sans-serif;
            font-size: 14px;
            color: #d96b91;
            margin-bottom: 5px;
        }

        .activity-score {
            font-family: "Comic Neue", sans-serif;
            font-size: 14px;
            font-weight: bold;
            color: #c6537c;
            margin-bottom: 12px;
        }

        /* VIEW PDF BUTTON */

        .file-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: white;
            background-color: #d96b91;
            padding: 9px 16px;
            border-radius: 8px;
            font-family: "Comic Neue", sans-serif;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s ease;
            cursor: none;
        }

        .file-link:hover {
            background-color: #b83f68;
            transform: scale(1.05);
        }

        /* PDF MODAL */

        .pdf-modal {
            display: none;
            position: fixed;
            z-index: 20000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(20, 10, 25, 0.88);
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .pdf-modal.show {
            display: flex;
        }

        .pdf-modal-content {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;

            box-shadow:
                0 0 40px rgba(243, 169, 194, 0.5);

            animation: popup 0.3s ease;
        }

        @keyframes popup {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* PDF HEADER */

        .pdf-header {
            height: 55px;
            background-color: #f8d8e5;
            border-bottom: 2px solid #f3a9c2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 60px 0 15px;
            font-family: "Comic Neue", sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-align: center;
        }

        /* PDF VIEWER */

        .pdf-viewer {
            display: block;
            width: 100%;
            height: calc(100% - 55px);
            border: none;
            background-color: #f5f5f5;
        }

        /* CLOSE BUTTON */

        .close-pdf {
            position: absolute;
            top: 8px;
            right: 10px;
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 50%;
            background-color: #f3a9c2;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: none;
            z-index: 20001;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.25);
        }

        .close-pdf:hover {
            background-color: #df789d;
        }

        /* MOBILE */

        @media (max-width: 800px) {
            header {
                height: 30px;
            }

            main {
                padding: 40px 15px;
            }

            main h2 {
                font-size: 30px;
            }

            #activitiesContainer {
                grid-template-columns: 1fr;
                max-width: 400px;
            }

            .pdf-preview {
                height: 220px;
            }

            .pdf-modal {
                padding: 10px;
            }

            .pdf-modal-content {
                width: 98%;
                height: 90vh;
            }

            .pdf-header {
                font-size: 17px;
            }
        }

        /* TOUCH DEVICES */

        @media (hover: none), (pointer: coarse) {
            body,
            .activity-card,
            .file-link,
            .close-pdf {
                cursor: auto;
            }

            .custom-cursor {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- FLOATING HEARTS -->

    <div class="floating-hearts">
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
    </div>

    <!-- HEADER -->

    <header></header>

    <!-- MAIN -->

    <main>
        <h2>My Activities</h2>

        <div id="activitiesContainer">

            <!-- ACTIVITY 1 -->

            <div class="activity-card">

                <div class="pdf-preview">
                    <img
                        src="Img/Screenshot 2026-10-08 174319.png"
                        alt="POLIDAN - ACTIVITY 1 Preview"
                    >
                </div>

                <div class="activity-info">
                    <div class="file-name">
                        POLIDAN - ACTIVITY 1
                    </div>

                    <div class="activity-date">
                        October 8, 2026
                    </div>

                    <div class="activity-score">
                        Score: none
                    </div>

                    <button
                        type="button"
                        class="file-link"
                        onclick="openPDF(
                            'Activity1/POLIDAN - ACTIVITY 1.pdf',
                            'POLIDAN - ACTIVITY 1'
                        )"
                    >
                        View PDF
                    </button>
                </div>
            </div>

            <!-- ACTIVITY 2 -->

            <div class="activity-card">

                <div class="pdf-preview">
                    <img
                        src="Img2/Screenshot 2026-10-08 174729.png"
                        alt="POLIDAN - ACTIVITY 2 Preview"
                    >
                </div>

                <div class="activity-info">
                    <div class="file-name">
                        POLIDAN - ACTIVITY 2
                    </div>

                    <div class="activity-date">
                        October 8, 2026
                    </div>

                    <div class="activity-score">
                        Score: none
                    </div>

                    <button
                        type="button"
                        class="file-link"
                        onclick="openPDF(
                            'Act/POLIDAN_ACTIVITY 2.pdf',
                            'POLIDAN_ACTIVITY 2.pdf'
                        )"
                    >
                        View PDF
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- PDF MODAL -->

    <div
        class="pdf-modal"
        id="pdfModal"
        aria-hidden="true"
    >
        <div class="pdf-modal-content">

            <!-- CLOSE BUTTON -->

            <button
                type="button"
                class="close-pdf"
                id="closePdfButton"
                onclick="closePDF()"
                aria-label="Close PDF"
            >
                ×
            </button>

            <!-- PDF TITLE -->

            <div class="pdf-header" id="pdfTitle">
                Activity PDF
            </div>

            <!-- PDF VIEWER -->

            <iframe
                class="pdf-viewer"
                id="pdfViewer"
                title="Activity PDF"
            ></iframe>

        </div>
    </div>

    <!-- CURSOR TRAIL -->

    <canvas id="cursorTrail"></canvas>

    <!-- CUSTOM CURSOR -->

    <div class="custom-cursor"></div>

    <script>
        /* PDF MODAL */

        const pdfModal = document.getElementById("pdfModal");
        const pdfViewer = document.getElementById("pdfViewer");
        const pdfTitle = document.getElementById("pdfTitle");
        const closePdfButton = document.getElementById("closePdfButton");

        function openPDF(pdfFile, title) {
            pdfViewer.src = pdfFile;
            pdfTitle.textContent = title;

            pdfModal.classList.add("show");
            pdfModal.setAttribute("aria-hidden", "false");

            cursor.style.zIndex = "30000";
            cursor.style.opacity = "1";
        }

        function closePDF() {
            pdfModal.classList.remove("show");
            pdfModal.setAttribute("aria-hidden", "true");
            pdfViewer.src = "";
        }

        /* CLOSE WHEN CLICKING OUTSIDE THE PDF */

        pdfModal.addEventListener("click", function(event) {
            if (event.target === pdfModal) {
                closePDF();
            }
        });

        /* CLOSE WITH ESCAPE */

        document.addEventListener("keydown", function(event) {
            if (
                event.key === "Escape" &&
                pdfModal.classList.contains("show")
            ) {
                closePDF();
            }
        });

        /* CUSTOM CURSOR */

        const cursor = document.querySelector(".custom-cursor");
        const canvas = document.getElementById("cursorTrail");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        document.addEventListener("mousemove", function(event) {
            mouseX = event.clientX;
            mouseY = event.clientY;

            cursor.style.left = mouseX + "px";
            cursor.style.top = mouseY + "px";
            cursor.style.opacity = "1";

            createHeart(mouseX, mouseY);
        });

        document.addEventListener("mouseleave", function() {
            cursor.style.opacity = "0";
        });

        document.addEventListener("mouseenter", function() {
            cursor.style.opacity = "1";
        });

        /* HEART PARTICLES */

        let hearts = [];

        function createHeart(x, y) {
            hearts.push({
                x: x,
                y: y,
                size: Math.random() * 10 + 8,
                speedY: Math.random() * -1.5 - 0.5,
                speedX: (Math.random() - 0.5) * 1.5,
                opacity: 1,
                rotation: Math.random() * 360
            });

            if (hearts.length > 45) {
                hearts.shift();
            }
        }

        /* DRAW HEART */

        function drawHeart(x, y, size, rotation, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation * Math.PI / 180);
            ctx.globalAlpha = opacity;
            ctx.fillStyle = "#f3a9c2";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#f3a9c2";

            ctx.beginPath();
            ctx.moveTo(0, size * 0.3);

            ctx.bezierCurveTo(
                -size, -size * 0.3,
                -size * 0.6, -size,
                0, -size * 0.35
            );

            ctx.bezierCurveTo(
                size * 0.6, -size,
                size, -size * 0.3,
                0, size * 0.3
            );

            ctx.fill();
            ctx.restore();
        }

        /* ANIMATION */

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = hearts.length - 1; i >= 0; i--) {
                const heart = hearts[i];

                heart.x += heart.speedX;
                heart.y += heart.speedY;
                heart.opacity -= 0.015;
                heart.size *= 0.995;

                drawHeart(
                    heart.x,
                    heart.y,
                    heart.size,
                    heart.rotation,
                    heart.opacity
                );

                if (heart.opacity <= 0) {
                    hearts.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        /* RESIZE */

        window.addEventListener("resize", resizeCanvas);

        /* CURSOR HOVER EFFECT */

        const clickableElements = document.querySelectorAll(
            "button, .activity-card"
        );

        clickableElements.forEach(function(element) {
            element.addEventListener("mouseenter", function() {
                cursor.classList.add("hover");
            });

            element.addEventListener("mouseleave", function() {
                cursor.classList.remove("hover");
            });
        });

        /* CLOSE BUTTON CURSOR EFFECT */

        closePdfButton.addEventListener("mouseenter", function() {
            cursor.classList.add("hover");
        });

        closePdfButton.addEventListener("mouseleave", function() {
            cursor.classList.remove("hover");
        });
    </script>

</body>
</html>
